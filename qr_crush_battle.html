<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d18">
<title>QRコード潰しバトル</title>
<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#121a2b;--line:#283650;--cyan:#4de4ff;--pink:#ff4d88;--muted:#9baac3}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#20304e 0,transparent 55%),var(--bg);color:#f5f8ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:22px 14px 40px}
main{width:min(760px,100%)}header{text-align:center;margin-bottom:18px}h1{font-size:clamp(1.65rem,6vw,2.7rem);margin:4px 0 5px;letter-spacing:.04em}header p{color:var(--muted);margin:0;font-size:.92rem}
.panel{background:linear-gradient(145deg,rgba(22,32,52,.97),rgba(13,20,34,.97));border:1px solid var(--line);border-radius:20px;padding:clamp(14px,3vw,24px);box-shadow:0 18px 55px #0007}
.turnbox{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.turn-label{color:var(--muted);font-size:.78rem;letter-spacing:.12em}.player{font-size:clamp(1.25rem,4vw,1.8rem);font-weight:900}.player.one{color:var(--cyan)}.player.two{color:var(--pink)}.turn-pill{border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:#dbe7ff;font-size:.82rem;white-space:nowrap}
.arena{display:grid;place-items:center;padding:14px;background:#080c14;border:1px solid #27354c;border-radius:16px;position:relative;overflow:hidden}.arena:before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 49.8%,#4de4ff0a 50%,transparent 50.2%);pointer-events:none}.qr-wrap{width:min(100%,440px);aspect-ratio:1;background:white;padding:12px;border-radius:9px;box-shadow:0 0 0 1px #fff3,0 0 36px #4de4ff22;position:relative}.qr-wrap canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:manipulation;cursor:crosshair}
.status{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:14px 2px 4px;color:var(--muted);font-size:.88rem}.read-state{font-weight:800;color:#74f0a2}.read-state.bad{color:#ff648c}.hint{text-align:center;color:var(--muted);font-size:.86rem;margin:10px 0 0}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer;transition:transform .15s,filter .15s}.btn:active{transform:scale(.97)}.btn.primary{background:linear-gradient(100deg,#20c8e8,#5988ff);color:#06101c;flex:1}.btn.secondary{background:#26344d;color:#edf4ff;border:1px solid #40516e}.btn:disabled{opacity:.45;cursor:not-allowed}
.rules{margin-top:15px;color:#b7c4d9;font-size:.85rem;line-height:1.65}.rules strong{color:#fff}.log{margin-top:12px;min-height:24px;text-align:center;color:#d7e4fa;font-size:.9rem}
.overlay{position:fixed;inset:0;background:#050812eF;display:none;place-items:center;padding:20px;z-index:5}.overlay.show{display:grid}.result{width:min(460px,100%);text-align:center;padding:30px 22px;border:1px solid #53617b;border-radius:22px;background:linear-gradient(145deg,#1c2942,#101827);box-shadow:0 0 90px #4de4ff22;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}.result h2{font-size:clamp(2rem,9vw,3.2rem);margin:0 0 8px}.result p{color:#c0cde1}.winner{color:#73f4b0}.loser{color:#ff6f98}@keyframes pop{from{transform:scale(.65) rotate(-4deg);opacity:0}to{transform:scale(1);opacity:1}}@keyframes flash{0%,100%{filter:brightness(1)}50%{filter:brightness(1.7)}}.critical{animation:flash .55s infinite}
footer{text-align:center;color:#71819d;font-size:.75rem;margin-top:16px}
@media(max-width:480px){body{padding:14px 10px 28px}.turnbox{align-items:flex-start}.qr-wrap{padding:8px}.controls .btn{padding:12px 14px}}
</style>
</head>
<body>
<main>
<header><h1>▦ QRコード潰しバトル</h1><p>一手ずつ、読み取り可能な限界を見極めろ。</p></header>
<section class="panel">
 <div class="turnbox"><div><div class="turn-label">CURRENT TURN</div><div id="currentPlayer" class="player one">PLAYER 1</div></div><div class="turn-pill" id="turnCount">TURN 1</div></div>
 <div class="arena"><div class="qr-wrap"><canvas id="qrCanvas" aria-label="タップまたはクリックしてQRコードを潰す"></canvas></div></div>
 <div class="status"><span>読み取り判定： <span id="readState" class="read-state">● 読み取り可能</span></span><span>破壊マス： <b id="damageCount">0</b></span></div>
 <p class="hint" id="hint">QRコード上の好きな場所を1か所タップ／クリック！</p>
 <div class="log" id="log" aria-live="polite">PLAYER 1 の番です。</div>
 <div class="controls"><button class="btn primary" id="newGame">新しいQRで対戦</button><button class="btn secondary" id="restart">同じQRで最初から</button></div>
 <div class="rules"><strong>ルール：</strong>交互に1回ずつ、QRコード上をタップ。タップ地点の周囲を黒く塗りつぶします。毎手、実際にQRをデコードして判定。読み取れなくなった手を打ったプレイヤーの負けです。</div>
</section>
<footer>QRの生成と読み取り判定にはブラウザ上のJavaScriptライブラリを使用します。</footer>
</main>
<div class="overlay" id="overlay"><div class="result"><h2 id="resultTitle">PLAYER 1 WIN!</h2><p id="resultText">QRコードを最後まで守り抜いた！</p><button class="btn primary" id="again">もう一度遊ぶ</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(() => {
 const canvas=document.getElementById('qrCanvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
 const $=id=>document.getElementById(id);
 let matrix=[],n=0,damaged=new Set(),turn=1,move=0,gameOver=false,payload='';
 const SCALE=12, QUIET=4;
 function makePayload(){return 'QR CRUSH BATTLE '+Math.random().toString(36).slice(2,10)+' '+Date.now();}
 function generate(){
  if(!window.qrcode||!window.jsQR){$('log').textContent='ライブラリを読み込めません。インターネット接続を確認して再読み込みしてください。';$('newGame').disabled=true;return;}
  payload=makePayload();const qr=qrcode(0,'H');qr.addData(payload);qr.make();n=qr.getModuleCount();matrix=Array.from({length:n},(_,r)=>Array.from({length:n},(_,c)=>qr.isDark(r,c)));
  damaged.clear();turn=1;move=0;gameOver=false;$('overlay').classList.remove('show');canvas.width=(n+QUIET*2)*SCALE;canvas.height=canvas.width;draw();update();$('log').textContent='PLAYER 1 の番です。';$('hint').textContent='QRコード上の好きな場所を1か所タップ／クリック！';
  const decoded=decode();if(!decoded){$('log').textContent='初期QRの検証に失敗しました。もう一度生成してください。';}
 }
 function draw(){
  const size=(n+QUIET*2)*SCALE;ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(matrix[r][c]&&!damaged.has(r*n+c)){ctx.fillStyle='#000';ctx.fillRect((c+QUIET)*SCALE,(r+QUIET)*SCALE,SCALE,SCALE);}
  // Damaged modules are solid black; red fine borders make even pre-existing black modules visible.
  for(const key of damaged){const r=Math.floor(key/n),c=key%n;ctx.fillStyle='#000';ctx.fillRect((c+QUIET)*SCALE,(r+QUIET)*SCALE,SCALE,SCALE);ctx.strokeStyle='#ff315f';ctx.lineWidth=1.3;ctx.strokeRect((c+QUIET)*SCALE+.7,(r+QUIET)*SCALE+.7,SCALE-1.4,SCALE-1.4);}
 }
 function decode(){const data=ctx.getImageData(0,0,canvas.width,canvas.height);return jsQR(data.data,data.width,data.height,{inversionAttempts:'dontInvert'});}
 function update(){ $('currentPlayer').textContent='PLAYER '+turn;$('currentPlayer').className='player '+(turn===1?'one':'two');$('turnCount').textContent='TURN '+(move+1);$('damageCount').textContent=damaged.size; }
 function endGame(loser){gameOver=true;const winner=loser===1?2:1;$('resultTitle').textContent='PLAYER '+winner+' WIN!';$('resultTitle').className='winner';$('resultText').textContent='PLAYER '+loser+' がQRコードを読み取れなくしました。';$('overlay').classList.add('show');$('hint').textContent='GAME OVER';$('log').textContent='QRコードの読み取りに失敗！';}
 function smash(ev){if(gameOver)return;const rect=canvas.getBoundingClientRect();const px=(ev.clientX-rect.left)/rect.width*canvas.width,py=(ev.clientY-rect.top)/rect.height*canvas.height;let c=Math.floor(px/SCALE)-QUIET,r=Math.floor(py/SCALE)-QUIET;if(r<0||c<0||r>=n||c>=n)return;
  // A move damages a compact 3x3 patch centered on the selected module.
  let added=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const rr=r+dr,cc=c+dc;if(rr>=0&&cc>=0&&rr<n&&cc<n){const k=rr*n+cc;if(!damaged.has(k)){damaged.add(k);added++;}}}
  if(!added){$('log').textContent='そこはすでに潰されています。別の場所を選んでください。';return;}
  move++;draw();$('damageCount').textContent=damaged.size;
  const result=decode();
  if(!result||result.data!==payload){$('readState').textContent='● 読み取り不能';$('readState').classList.add('bad');canvas.classList.add('critical');endGame(turn);return;}
  $('readState').textContent='● 読み取り可能';$('readState').classList.remove('bad');canvas.classList.remove('critical');$('log').textContent='読み取り成功！ '+result.data+' — 次のプレイヤーへ';turn=turn===1?2:1;update();
 }
 canvas.addEventListener('pointerdown',smash);$('newGame').addEventListener('click',generate);$('restart').addEventListener('click',()=>{if(!matrix.length)return;damaged.clear();turn=1;move=0;gameOver=false;$('overlay').classList.remove('show');$('readState').textContent='● 読み取り可能';$('readState').classList.remove('bad');canvas.classList.remove('critical');draw();update();$('log').textContent='同じQRコードで再戦！ PLAYER 1 の番です。';});$('again').addEventListener('click',generate);
 generate();
})();
</script>
</body>
</html>
